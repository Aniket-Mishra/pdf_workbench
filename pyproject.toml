[project]
name = "pdf-workbench"
version = "0.1.0"
description = "Fast local PDF toolkit"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.1",
    "pdfminer-six==20250506",
    "pdfplumber==0.11.7",
    "pikepdf==10.12.0",
    "pymupdf==1.28.2",
    "streamlit[pdf]==1.56.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
